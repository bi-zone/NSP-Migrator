[tool.poetry]
name = "policy-migrator-back-project"
version = "0.1.0"
description = "Policy Migrator backend template (Hexagonal + DDD-lite)"
authors = ["yaroslavborshev <yaroslav@example.com>"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic-settings = "^2.11.0"
dependency-injector = "^4.48.1"
sqlalchemy = "^2.0.43"
greenlet = "^3.4.0"
asyncpg = "^0.30.0"
alembic = "^1.16.5"
psycopg = { extras = ["binary"], version = "^3.2.10" }
python-json-logger = "^3.3.0"
orjson = "^3.11.3"
email-validator = "^2.3.0"
httpx = "^0.28.1"
cryptography = "^49.0.0"

[tool.poetry.group.streamlit]
optional = true

[tool.poetry.group.streamlit.dependencies]
streamlit = "^1.58.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.1"
mypy = "^1.20.1"
pre-commit = "^4.5.1"
pytest = "^8.4.0"
pytest-asyncio = "^1.4.0"

# -- ruff
[tool.ruff]
line-length = 88
target-version = "py312"

extend-exclude = [
    "migrations",
    "docs",
    ".venv",
    "tests",
]

lint.select = [
    "E",   # pycodestyle (error)
    "F",   # pyflakes
    "W",   # pycodestyle (warning)
    "C90", # complexity
    "I",   # isort (импорт-орт)
    "N",   # pep8‑naming
    "UP",  # pyupgrade (направлено на новейшие возможности)
    "RUF", # собственные правила ruff
]

lint.ignore = [
    "E501",      # строка слишком длинная
    "UP037",     # устаревшие f‑строки
    "UP046",     # new generic declare
    "UP040",     # new type declare
    "RUF003",    # cirillic `c`
    "RUF002",    # docstring specials
    "RUF001",    # docstring specials
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "dependency_injector",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "psycopg",
    "httpx",
]

[tool.ruff.lint.per-file-ignores]
"src/streamlit_app/Home.py" = ["N999"]

# -- mypy
[tool.mypy]
python_version = "3.12"
packages = ["app"]
exclude = "^tests/"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

# Keep mypy as a lightweight CI gate for this template.
# The codebase intentionally uses Protocols and some dynamic patterns (DI, SQLAlchemy)
# and is not yet fully typed end-to-end.
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_defs = false

# Reduce noise for current repository/UoW patterns; tighten later per-module if needed.
disable_error_code = ["no-untyped-def", "attr-defined", "misc", "override"]

[tool.poetry.scripts]
start = "app.main:run"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
