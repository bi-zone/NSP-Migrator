! Cisco ASA sample import:
!   1) LAN -> LAN : ICMP
!   2) LAN -> WAN : ANY
!   3) LAN -> OVERLAY : ANY
!   4) OVERLAY -> LAN : ICMP
!
!
hostname BZ-CSP-LAB

interface GigabitEthernet0/0
 nameif lan
 security-level 100
 ip address 192.168.1.1 255.255.255.0
!
interface GigabitEthernet0/1
 nameif wan
 security-level 0
 ip address 198.51.100.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif overlay
 security-level 50
 ip address 10.200.0.1 255.255.255.0
!

! Address group "AG-ANY" in UI ~= keyword any in ACE (object-group below for show run realism)
object-group network AG_ANY
 description BI.ZONE CSP style: any
 network-object 0.0.0.0 0.0.0.0

object-group icmp-type OG_ICMP_ECHO_REQUEST
 icmp-object echo

! 1) LAN -> LAN : ICMP
access-group ACL_LAN_TO_LAN out interface lan
access-list ACL_LAN_TO_LAN extended permit icmp any any echo

! 2) LAN -> WAN : ANY
access-group ACL_LAN_TO_WAN out interface lan
access-list ACL_LAN_TO_WAN extended permit ip any any

! 3) LAN -> OVERLAY : ANY
access-group ACL_LAN_TO_OVERLAY out interface lan
access-list ACL_LAN_TO_OVERLAY extended permit ip any any

! 4) OVERLAY -> LAN : ICMP
access-group ACL_OVERLAY_TO_LAN out interface overlay
access-list ACL_OVERLAY_TO_LAN extended permit icmp any any echo
