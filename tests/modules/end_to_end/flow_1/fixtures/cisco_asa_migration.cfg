object network SRC_APP
 host 10.0.0.1
object network DST_EXACT
 host 10.0.0.2
object network DST_COVERED
 host 10.0.0.3
object network DST_NEW
 host 10.0.0.4

object service SVC_HTTPS
 service tcp destination eq 443
object service SVC_HTTP
 service tcp destination eq 80
object service SVC_SSH
 service tcp destination eq 22

interface GigabitEthernet0/1
 nameif inside

access-list ACL_OUTSIDE_TO_INSIDE extended permit tcp object SRC_APP object DST_EXACT object SVC_HTTPS
access-list ACL_OUTSIDE_TO_INSIDE extended permit tcp object SRC_APP object DST_COVERED object SVC_HTTP
access-list ACL_OUTSIDE_TO_INSIDE extended permit tcp object SRC_APP object DST_NEW object SVC_SSH
access-group ACL_OUTSIDE_TO_INSIDE in interface GigabitEthernet0/1
