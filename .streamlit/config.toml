[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"

[theme.light]
primaryColor = "#0068C9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#1F2937"
borderColor = "#D0D5DD"
codeBackgroundColor = "#F2F4F7"
greenColor = "#16A34A"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#166534"
yellowColor = "#D97706"
yellowBackgroundColor = "#FEF3C7"
yellowTextColor = "#92400E"
redColor = "#DC2626"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
grayColor = "#6B7280"
grayBackgroundColor = "#F3F4F6"
grayTextColor = "#374151"

[theme.light.sidebar]
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
borderColor = "#D0D5DD"

[theme.dark]
primaryColor = "#64B5FF"
